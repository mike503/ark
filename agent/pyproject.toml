[project]
name = "ark"
dynamic = ["version"]
description = "ark agent — extract from encrypted iPhone backup, local staging, sync to ark server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "iphone-backup-decrypt>=0.10.0",
  "pycryptodome>=3.20.0",
  "pytypedstream>=0.1.0",
  "PyYAML>=6.0",
]

[project.scripts]
ark = "ark.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "ark.versioning.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
