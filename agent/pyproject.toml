[project]
name = "ark"
version = "0.1.0"
description = "ark agent — extract from iPhone backup, local staging, sync to ark server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.scripts]
ark = "ark.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
