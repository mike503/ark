# ark server (API + UI)
#
# MySQL is external — not started by this file.
# Host networking keeps DATABASE_HOSTNAME=localhost working with typical
# local MariaDB grants without exposing the DB on the Docker bridge.
#
# From the repo root:
#   docker compose up -d --build
#   docker compose restart
#   docker compose logs -f ark

services:
  ark:
    build:
      context: ./server
      dockerfile: Dockerfile
      additional_contexts:
        # Tablerock (internal, not-published-yet personal development framework)
        tablerock: ../tablerock
    image: ark:latest
    container_name: ark
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: ${APP_PORT:-3010}
      APP_NAME: ${APP_NAME:-ark}
      ARK_DATA_DIR: ${ARK_DATA_DIR:-/data}
      # Host network → localhost MySQL is correct. Override only for remote DB.
      DATABASE_HOSTNAME: ${DOCKER_DATABASE_HOSTNAME:-localhost}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
    volumes:
      - ${ARK_DATA_HOST:-./data}:/data
      - ./server/logs:/workspace/server/logs
      - ./server/tmp:/workspace/server/tmp
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.APP_PORT||3010)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
